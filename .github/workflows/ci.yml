name: OrganicAI CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: organicai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  SECRET_KEY: ci-test-secret-key-that-is-long-enough-for-tests
  OPENAI_API_KEY: disabled
  ELEVENLABS_API_KEY: disabled
  EMAIL_DELIVERY_DRIVER: disabled
  REAL_PROVIDER_TESTS_ENABLED: "false"
  LIVE_PROVIDER_VALIDATION_ENABLED: "false"
  LIVE_PROVIDER_WRITE_VALIDATION_ENABLED: "false"

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Backend compile and unit tests
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m compileall -q app tests
          python -m pytest -q -m "not postgres" -rs --basetemp .tmp/pytest-ci-backend

  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.6-bookworm
        env:
          POSTGRES_DB: organicai_ci
          POSTGRES_USER: organicai_ci
          POSTGRES_PASSWORD: organicai_ci_password_for_tests_only
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: PostgreSQL migration preflight and marker tests
        working-directory: backend
        env:
          TEST_POSTGRES_DATABASE_URL: postgresql+psycopg2://organicai_ci:organicai_ci_password_for_tests_only@127.0.0.1:5432/organicai_ci
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m app.scripts.prepare_postgres_test_database > ../postgres-prepare-ci.json
          python -m pytest -q -m postgres -rs --basetemp .tmp/pytest-ci-postgres
      - name: Upload PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-ci-evidence
          path: postgres-prepare-ci.json
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend unit, typecheck and build
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run test
          npm run build

  e2e-mock:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install mock E2E dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          cd frontend
          npm ci
          npx playwright install chromium --with-deps
      - name: Playwright mock/local suite
        working-directory: frontend
        env:
          REAL_PROVIDER_TESTS_ENABLED: "false"
          VITE_REAL_PROVIDER_TESTS_ENABLED: "false"
        run: npm run test:e2e
      - name: Upload sanitized Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mock-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  security-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Security, privacy and archive audits
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m app.scripts.security_scan
          python -m app.scripts.audit_route_authorization
          python -m app.scripts.audit_personal_data_inventory
          python -m app.scripts.audit_secret_readiness
          python -m app.scripts.audit_telemetry_privacy
          python -m app.scripts.validate_ci_workflows
          python -m pytest tests/test_task12a_source_archive.py -q --basetemp .tmp/pytest-ci-archive
          python -m app.scripts.create_source_archive --output dist/OrganicAI-Compass-source-ci.zip > ../source-archive-ci.json
      - name: Upload archive audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-archive-evidence
          path: source-archive-ci.json
          if-no-files-found: ignore

  dependency-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate dependency vulnerability reports
        run: |
          mkdir -p reports/dependencies
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          python -m pip list --format=json > reports/dependencies/backend-pip-list.json
          cd frontend
          npm ci
          npm audit --json > ../reports/dependencies/frontend-npm-audit.json || true
      - name: Upload dependency reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-reports
          path: reports/dependencies
          if-no-files-found: ignore

  container-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build backend image
        run: docker build --file backend/Dockerfile --target runtime --tag organicai-backend:ci backend
      - name: Build frontend image
        run: docker build --file frontend/Dockerfile --target runtime --tag organicai-frontend:ci frontend

  release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [backend, postgres-integration, frontend, e2e-mock, security-archive, dependency-report, container-build]
    steps:
      - name: Release gate summary
        run: echo "Release gate checks completed without mandatory live provider calls."
