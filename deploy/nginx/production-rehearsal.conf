pid /tmp/nginx.pid;

events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr notice;
    server_tokens off;
    client_body_temp_path /tmp/nginx-client-temp;
    proxy_temp_path /tmp/nginx-proxy-temp;
    fastcgi_temp_path /tmp/nginx-fastcgi-temp;
    uwsgi_temp_path /tmp/nginx-uwsgi-temp;
    scgi_temp_path /tmp/nginx-scgi-temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream organicai_frontend {
        server frontend:8080;
    }

    upstream organicai_backend {
        server backend:8020;
    }

    server {
        listen 8080;
        server_name 127.0.0.1 localhost rehearsal.local;
        client_max_body_size 8m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; media-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'none'" always;

        location ~ /\. {
            return 404;
        }

        location ~* \.(?:db|sqlite|sqlite3|dump|bak|backup|env|log)$ {
            return 404;
        }

        location ~ \.\. {
            return 400;
        }

        location = /internal/metrics {
            return 404;
        }

        location ~ ^/(prometheus|grafana|otel)(/|$) {
            return 404;
        }

        location @api_unavailable {
            internal;
            default_type application/json;
            add_header X-Request-ID $request_id always;
            add_header Retry-After "30" always;
            return 503 '{"detail":"OrganicAI Compass is temporarily unavailable.","code":"SERVICE_TEMPORARILY_UNAVAILABLE","requestId":"$request_id"}';
        }

        location = /health.txt {
            proxy_pass http://organicai_frontend;
            proxy_set_header Host app.rehearsal.local;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/ {
            proxy_pass http://organicai_backend;
            proxy_intercept_errors on;
            error_page 502 503 504 = @api_unavailable;
            proxy_http_version 1.1;
            proxy_set_header Host api.rehearsal.local;
            proxy_set_header X-Forwarded-Host api.rehearsal.local;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
        }

        location /health {
            proxy_pass http://organicai_backend;
            proxy_intercept_errors on;
            error_page 502 503 504 = @api_unavailable;
            proxy_set_header Host api.rehearsal.local;
            proxy_set_header X-Forwarded-Host api.rehearsal.local;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
        }

        location / {
            proxy_pass http://organicai_frontend;
            proxy_set_header Host app.rehearsal.local;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
        }
    }
}
